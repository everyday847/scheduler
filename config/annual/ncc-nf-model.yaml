# Annual config — NF MODEL. No workbook; fellows listed explicitly.
# CCM pool parameterized: add "CCM Generic 2" to CCM if 1-CCM is too tight (spec
# supply/demand). Phase 1 ships with 1 CCM.
#
# night_call / weekend_call are omitted: the builders iterate over an absent key
# as an empty list, producing NightSolverConfig / WeekendSolverConfig with all
# totals None (no per-fellow quotas yet — Phase 1 is a feasibility skeleton).
solver_options:
  call_tier_day_granular: true
  # --- NF density / continuity / rest rules (all verified 2026-06-18) ---
  nf_week_off_cap: 2              # Rule A: <=2 off days/week (exempt a full in-week NF rest)
  nf_max_consecutive_call_days: 14  # Rule B: <=14 consecutive call days
  nf_ccm_no_bridge_blocks: true  # Rule C: CCM NF runs don't bridge a 4wk block boundary
  nf_min_ncc_block_weeks: true   # Rule 11: NCC call blocks >= 2 consecutive weeks
  nf_ncc1_continuity: weekday    # NCC1 constant Mon-Fri; weekend NCC1 free
  # --- soft concentration objective (fewer NCC weeks => more Elec; concentrate CCM) ---
  nf_ncc_week_penalty: 10        # per JR/SR NCC-labeled week
  nf_ccm_block_penalty: 50       # per active CCM 4wk NCC block
  # nf_run_length / nf_rest_days left at defaults (4-6 / 1-before-2-after).

fellow_groups:
  NCC_JR: [JR1, JR2, JR3]
  NCC_SR: [SR1, SR2]
  CCM: [CCM Generic 1, CCM Generic 2]

shifts: [NCC, MICU, NS, SICU, Elec, Vac, Anaesthesia, Stroke, "Telestroke/Clinic"]

horizon_start: '2026-07-01'
num_weeks: 53

rules:
  # --- NCC_JR background rotations ---
  - {type: shift_total, name: "JR MICU total", groups: [NCC_JR], shifts: [MICU], relation: exactly, count: 16, strength: hard}
  - {type: shift_total, name: "JR MICU orientation", groups: [NCC_JR], shifts: [MICU], relation: exactly, count: 4, window: [0, 4], strength: hard}
  - {type: block_rotation, name: "JR MICU 4wk blocks", groups: [NCC_JR], shifts: [MICU], block_size: 4, strength: hard}
  - {type: block_rotation, name: "JR Anaesthesia 4wk block", groups: [NCC_JR], shifts: [Anaesthesia], block_size: 4, strength: hard}
  - {type: shift_total, name: "JR Anaesthesia total", groups: [NCC_JR], shifts: [Anaesthesia], relation: exactly, count: 4, strength: hard}
  - {type: shift_total, name: "JR SICU total", groups: [NCC_JR], shifts: [SICU], relation: exactly, count: 4, strength: hard}
  - {type: block_rotation, name: "JR SICU 2wk blocks", groups: [NCC_JR], shifts: [SICU], block_size: 2, strength: hard}
  # --- NCC_SR background rotations ---
  - {type: shift_total, name: "SR MICU total", groups: [NCC_SR], shifts: [MICU], relation: exactly, count: 8, strength: hard}
  - {type: block_rotation, name: "SR MICU 4wk blocks", groups: [NCC_SR], shifts: [MICU], block_size: 4, strength: hard}
  - {type: block_rotation, name: "SR NS 2wk block", groups: [NCC_SR], shifts: [NS], block_size: 2, strength: hard}
  - {type: shift_total, name: "SR NS total", groups: [NCC_SR], shifts: [NS], relation: exactly, count: 6, strength: hard}
  - {type: shift_total, name: "SR Stroke total", groups: [NCC_SR], shifts: [Stroke], relation: exactly, count: 2, strength: hard}
  - {type: shift_total, name: "SR Telestroke total", groups: [NCC_SR], shifts: ["Telestroke/Clinic"], relation: exactly, count: 2, strength: hard}
  # --- Per-fellow pinned Vacation weeks (breaks fellow symmetry; replaces Vac shift_total) ---
  # JR1 → weeks 8, 28, 32
  - {type: specific_assignment, name: "JR1 Vac wk8",  fellow: JR1, week: 8,  shift: Vac, strength: hard}
  - {type: specific_assignment, name: "JR1 Vac wk28", fellow: JR1, week: 28, shift: Vac, strength: hard}
  - {type: specific_assignment, name: "JR1 Vac wk32", fellow: JR1, week: 32, shift: Vac, strength: hard}
  # JR2 → weeks 11, 25, 41
  - {type: specific_assignment, name: "JR2 Vac wk11", fellow: JR2, week: 11, shift: Vac, strength: hard}
  - {type: specific_assignment, name: "JR2 Vac wk25", fellow: JR2, week: 25, shift: Vac, strength: hard}
  - {type: specific_assignment, name: "JR2 Vac wk41", fellow: JR2, week: 41, shift: Vac, strength: hard}
  # JR3 → weeks 14, 20, 27
  - {type: specific_assignment, name: "JR3 Vac wk14", fellow: JR3, week: 14, shift: Vac, strength: hard}
  - {type: specific_assignment, name: "JR3 Vac wk20", fellow: JR3, week: 20, shift: Vac, strength: hard}
  - {type: specific_assignment, name: "JR3 Vac wk27", fellow: JR3, week: 27, shift: Vac, strength: hard}
  # SR1 → weeks 10, 30, 44
  - {type: specific_assignment, name: "SR1 Vac wk10", fellow: SR1, week: 10, shift: Vac, strength: hard}
  - {type: specific_assignment, name: "SR1 Vac wk30", fellow: SR1, week: 30, shift: Vac, strength: hard}
  - {type: specific_assignment, name: "SR1 Vac wk44", fellow: SR1, week: 44, shift: Vac, strength: hard}
  # SR2 → weeks 17, 35, 48
  - {type: specific_assignment, name: "SR2 Vac wk17", fellow: SR2, week: 17, shift: Vac, strength: hard}
  - {type: specific_assignment, name: "SR2 Vac wk35", fellow: SR2, week: 35, shift: Vac, strength: hard}
  - {type: specific_assignment, name: "SR2 Vac wk48", fellow: SR2, week: 48, shift: Vac, strength: hard}
  # --- CCM generic coverage: 4-week NCC blocks (first block long: 53 = 5 + 4*12) ---
  - {type: block_rotation, name: "CCM NCC 4wk blocks", groups: [CCM], shifts: [NCC], block_size: 4, block_offset: 1, strength: hard, nf_days_per_block: [6, 8]}
  # --- Elec: un-forbid (a budget rule stops derive_forbidden_shifts zeroing it) + floor/target ---
  # Hard floor guarantees a minimum; soft target pulls toward the ideal. Floor kept
  # conservative (3) — the last verified-feasible level under the binding Rule A; the
  # cap×band frontier sweep may license raising it.
  - {type: shift_total, name: "JR Elec floor",  groups: [NCC_JR], shifts: [Elec], relation: at_least, count: 3, strength: hard}
  - {type: shift_total, name: "SR Elec floor",  groups: [NCC_SR], shifts: [Elec], relation: at_least, count: 3, strength: hard}
  - {type: shift_total, name: "JR Elec target", groups: [NCC_JR], shifts: [Elec], relation: at_least, count: 9, strength: soft}
  - {type: shift_total, name: "SR Elec target", groups: [NCC_SR], shifts: [Elec], relation: at_least, count: 9, strength: soft}
  # --- Hard NCC-week cap per group (item #3) ---
  # DEFERRED: both caps together cause solver timeout (>120s) on the full-year model.
  # Probe showed Stage 2 (add caps) = TIMEOUT. Kept here as inactive for future re-evaluation.
  - {type: shift_total, name: "JR NCC week cap", groups: [NCC_JR], shifts: [NCC], relation: at_most, count: 14, strength: hard, active: false}
  - {type: shift_total, name: "SR NCC week cap", groups: [NCC_SR], shifts: [NCC], relation: at_most, count: 22, strength: hard, active: false}
