# STROKE-GROUP experiment (user 2026-06-18): the week-band config + a 4-fellow Stroke
# group + five new hard NF rules. Derived from ncc-nf-weekband-jr12-14-sr20-22-3ccm.yaml
# (do NOT edit that file). New vs. the week-band base:
#   - Stroke group (4 fellows): 6 NCC weeks each, 3-week blocks, <=12 NF days, blank otherwise.
#   - nf_min_ncc_run_days: 4   — NCC service (NCC1/NCC2) runs are >=4 consecutive days.
#   - nf_weekend_ncc1_paired   — weekend NCC1 Sat==Sun (one assignment).
#   - nf_no_triple_ccm         — >=1 call role per day held by a non-CCM (JR/SR/Stroke).
#   - nf_stroke_lex_order      — Stroke first-NCC-week strictly increasing (symmetry break).
#   - nf_stroke_nf_cap: 12     — each Stroke fellow holds <=12 NF days total.
#   - JR/SR Vac exactly 3      — caps total Vac (the pins fix WHICH weeks, not the COUNT).
# Roster: JR3 + SR2 + CCM3 + Stroke4 = 12 fellows; Stroke adds 24 NCC-fellow-weeks of supply.
solver_options: {call_tier_day_granular: true, nf_week_off_cap: 2, nf_max_consecutive_call_days: 14,
  nf_ccm_no_bridge_blocks: true, nf_min_ncc_block_weeks: true, nf_ncc1_continuity: weekday,
  nf_ncc_week_penalty: 10, nf_ccm_block_penalty: 50, nf_service_day_band: 'off',
  nf_min_ncc_run_days: 4, nf_weekend_ncc1_paired: true, nf_no_triple_ccm: true,
  nf_stroke_lex_order: true, nf_stroke_nf_cap: 12}
fellow_groups:
  NCC_JR: [JR1, JR2, JR3]
  NCC_SR: [SR1, SR2]
  CCM: [CCM Generic 1, CCM Generic 2, CCM Generic 3]
  Stroke: [Stroke A, Stroke B, Stroke C, Stroke D]
shifts: [NCC, MICU, NS, SICU, Elec, Vac, Anaesthesia, Stroke, Telestroke/Clinic]
horizon_start: '2026-07-01'
num_weeks: 53
rules:
- type: shift_total
  name: JR MICU total
  groups: [NCC_JR]
  shifts: [MICU]
  relation: exactly
  count: 16
  strength: hard
- type: shift_total
  name: JR MICU orientation
  groups: [NCC_JR]
  shifts: [MICU]
  relation: exactly
  count: 4
  window: [0, 4]
  strength: hard
- type: block_rotation
  name: JR MICU 4wk blocks
  groups: [NCC_JR]
  shifts: [MICU]
  block_size: 4
  strength: hard
- type: block_rotation
  name: JR Anaesthesia 4wk block
  groups: [NCC_JR]
  shifts: [Anaesthesia]
  block_size: 4
  strength: hard
- type: shift_total
  name: JR Anaesthesia total
  groups: [NCC_JR]
  shifts: [Anaesthesia]
  relation: exactly
