  strength: hard
- type: shift_total
  name: JR SICU total
  groups: [NCC_JR]
  shifts: [SICU]
  relation: exactly
  count: 4
  strength: hard
- type: block_rotation
  name: JR SICU 2wk blocks
  groups: [NCC_JR]
  shifts: [SICU]
  block_size: 2
  strength: hard
- type: shift_total
  name: SR MICU total
  groups: [NCC_SR]
  shifts: [MICU]
  relation: exactly
  count: 8
  strength: hard
- type: block_rotation
  name: SR MICU 4wk blocks
  groups: [NCC_SR]
  shifts: [MICU]
  block_size: 4
  strength: hard
- type: block_rotation
  name: SR NS 2wk block
  groups: [NCC_SR]
  shifts: [NS]
