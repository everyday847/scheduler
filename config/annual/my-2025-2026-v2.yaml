rules:

  # ===================================================================
  # NCC Junior Coverage Totals
  # (decomposed from ncc_jr_service_profile)
  # Zero-shifts are DERIVED — any shift not mentioned here is forbidden.
  # ===================================================================
  - name: "NCC Junior: MICU Total"
    type: shift_total
    groups: [NCC_JR]
    shifts: [MICU]
    relation: exactly
    count: 20
    strength: hard
    active: true

  - name: "NCC Junior: Anaesthesia Total"
    type: shift_total
    groups: [NCC_JR]
    shifts: [Anaesthesia]
    relation: exactly
    count: 4
    strength: hard
    active: true

  - name: "NCC Junior: Elective Total"
    type: shift_total
    groups: [NCC_JR]
    shifts: [Elec]
    relation: exactly
    count: 8
    strength: hard
    active: true

  - name: "NCC Junior: Vacation Total"
