  # ===================================================================
  # NH Coverage Totals
  # (decomposed from nh_service_profile — was inactive/hard)
  # ===================================================================
  - name: "NH: NCC Total"
    type: shift_total
    groups: [NH]
    shifts: [NCC1, NCC2]
    relation: exactly
    count: 3
    strength: hard
    active: false

  - name: "NH: Swing Total"
    type: shift_total
    groups: [NH]
    shifts: [Swing]
    relation: exactly
    count: 1
    strength: hard
    active: false

  # ===================================================================
  # CCM Coverage Totals
  # (decomposed from ccm_service_profile)
  # ===================================================================
  - name: "CCM: NCC Total"
    type: shift_total
    groups: [CCM]
    shifts: [NCC1, NCC2]
    relation: at_least
    count: 3
    strength: hard
    active: true

  - name: "CCM: Swing Total"
    type: shift_total
    groups: [CCM]
    shifts: [Swing]
    relation: at_least
    count: 1
    strength: hard
    active: true

  # ===================================================================
  # CCM NCC Block (from ccm active_blocks)
  # ===================================================================
  - name: CCM NCC Block
    type: block_rotation
    groups: [CCM]
    shifts: [NCC1, NCC2, Swing]
    block_size: 4
    strength: hard
    active: true

  # ===================================================================
  # Max Consecutive Rules (moved from standing to annual)
  # ===================================================================
  - name: Core ICU Max Consecutive
    type: max_consecutive
    groups: [NCC_JR, NCC_SR, STROKE, NH]
    shifts: [NCC1, NCC2, Swing, SICU, MICU, Stroke]
    max_weeks: 8
    strength: hard
    active: true

  - name: NCC Team Max Consecutive
    type: max_consecutive
    groups: [NCC_JR, NCC_SR, STROKE, NH]
    shifts: [NCC1, NCC2, Swing]
    max_weeks: 6
    strength: hard
    active: true

  - name: Swing Max Consecutive
    type: max_consecutive
    groups: [NCC_JR, NCC_SR, STROKE]
    shifts: [Swing]
    max_weeks: 2
    strength: hard
    active: true

  - name: Stroke Short Core ICU Runs
    type: max_consecutive
    groups: [STROKE]
    shifts: [NCC1, NCC2, Swing, SICU, MICU, Stroke]
    max_weeks: 2
    strength: soft
    active: false

  # ===================================================================
  # Rotation Continuity (moved from standing to annual)
  # ===================================================================
  - name: NCC 2-Week Team Continuity
    type: rotation_continuity
    groups: [NCC_JR, NCC_SR, CCM]
    block_size: 2
    choices:
      - [NCC1, Swing]
      - [NCC2, Swing]
    allow_none: true
    strength: hard
    active: true

  - name: NCC 4-Week Team Preference
    type: rotation_continuity
    groups: [NCC_JR, NCC_SR]
    block_size: 4
    choices:
      - [NCC1, Swing]
      - [NCC2, Swing]
    allow_none: true
    strength: soft
    active: false

  # ===================================================================
  # Coverage Target (combined swing_deficit + minimize_swing_deficit)
  # ===================================================================
  - name: Swing Coverage Target
    type: coverage_target
    groups: [NCC_JR, NCC_SR, STROKE, CCM, NH]
    shifts: [Swing]
    max_uncovered_weeks: 2
    strength: soft
    active: false

  # ===================================================================
  # Balance
  # ===================================================================
  - name: Half-Year Balance
    type: windowed_balance
    groups: [NCC_JR, NCC_SR]
    shifts: [MICU]
    window_a: [0, 26]
    window_b: [26, 52]
    max_difference: 4
    strength: soft
    active: false

  # ===================================================================
  # Windowed Shift Totals (decomposed from one-off rules)
  # ===================================================================
  - name: "Stroke NIR First Half"
    type: shift_total
    groups: [STROKE]
    shifts: [NIR]
    relation: exactly
    count: 1
    window: [0, 26]
    strength: hard
    active: true

  - name: "Stroke NIR Second Half"
    type: shift_total
    groups: [STROKE]
    shifts: [NIR]
    relation: exactly
    count: 1
    window: [26, 52]
    strength: hard
    active: true

  - name: "Stroke SCVMC Second Half"
    type: shift_total
    groups: [STROKE]
    shifts: [SCVMC Rehab]
    relation: exactly
    count: 2
    window: [26, 52]
    strength: hard
    active: true

  # ===================================================================
  # Block Rotations (moved from standing to annual)
  # ===================================================================
  - name: Stroke 2-Week Blocks
    type: block_rotation
    groups: [STROKE]
    shifts: [Stroke, Telestroke/Clinic]
    block_size: 2
    strength: hard
    active: false

  # ===================================================================
  # Annual-specific rules
  # ===================================================================
  - name: vacation_requests
    type: vacation_request_policy
    active: true
    hard_request_count: 3

