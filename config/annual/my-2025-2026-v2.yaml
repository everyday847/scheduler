    relation: exactly
    count: 4
    strength: hard
    active: true

  - name: "NCC Junior: SICU Total"
    type: shift_total
    groups: [NCC_JR]
    shifts: [SICU]
    relation: at_least
    count: 4
    strength: hard
    active: true

  - name: "NCC Junior: NCC+Swing Total"
    type: shift_total
    groups: [NCC_JR]
    shifts: [Swing, NCC1, NCC2]
