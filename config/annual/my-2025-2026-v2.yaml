    shifts: [Swing]
    relation: exactly
    count: 2
    strength: soft
    active: true

  - name: "Stroke: NCC Total"
    type: shift_total
    groups: [STROKE]
    shifts: [NCC1, NCC2]
    relation: exactly
    count: 4
    strength: soft
    active: true

  - name: "Stroke: Stroke Service Total"
    type: shift_total
    groups: [STROKE]
    shifts: [Stroke]
    relation: at_least
    count: 11
    strength: soft
    active: true

  - name: "Stroke: Elective Total"
    type: shift_total
    groups: [STROKE]
    shifts: [Elec]
    relation: at_least
    count: 2
    strength: soft
    active: true

  - name: "Stroke: Vacation Total"
    type: shift_total
    groups: [STROKE]
    shifts: [Vac]
    relation: at_least
    count: 3
