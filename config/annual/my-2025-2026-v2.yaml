  - name: "Stroke: Telestroke Total"
    type: shift_total
    groups: [STROKE]
    shifts: [Telestroke/Clinic]
    relation: at_least
    count: 13
    strength: soft
    active: true

  - name: "Stroke: Clinic/Elective Total"
    type: shift_total
    groups: [STROKE]
    shifts: [Clinic/Elective]
    relation: at_least
    count: 9
