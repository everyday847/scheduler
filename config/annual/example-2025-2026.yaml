# Annual YAML defines the scheduling vocabulary for the current year:
# shifts, fellow groups, requests, and exceptions.
# This file is accepted by `uv run scheduler solve --request ...`.

shifts:
  - SICU
  - MICU
  - NS
  - Anaesthesia
  - NCC1
  - NCC2
  - Swing
  - Elec
  - Vac
  - Stroke
  - Telestroke/Clinic
  - Clinic/Elective
  - SCVMC Rehab
  - NIR
  - ISC

fellow_groups:
  NCC_JR:
    - NCC Raya
    - NCC Joseph

  NCC_SR:
    - NCC David
    - NCC Prash

  STROKE:
    - Stroke Gabi
    - Stroke Jeff
    - Stroke Victoria
    - Stroke Parshva

  CCM:
    - CCM Generic

  NH:
    - NH Adam

fellow_week_pairs:
  NCC Prash: []
  NCC David: []
  NCC Raya: []
  NCC Joseph: []
  Stroke Gabi: []
  Stroke Jeff: []
  Stroke Victoria: []
  Stroke Parshva: []

annual_rules:
  rules:
    - name: vacation_requests
      kind: vacation_request_policy
      active: true
      hard_request_count: 3

    - name: jeff_abpn_stroke
      kind: specific_assignment
      active: false
      fellow: Stroke Jeff
      week: 11
      shift: Stroke
      strength: hard
      reason: ABPN

    - name: abpn_backup_telestroke
      kind: specific_assignment
      active: false
      fellows: [NCC Prash, NCC David]
      week: 11
      shift: Telestroke/Clinic
      strength: soft
      reason: ABPN backup coverage

    - name: first_week_senior_on_stroke
      kind: specific_assignment
      active: true
      fellow_groups: [NCC_SR]
      week: 1
      shift: Stroke
      strength: hard

    - name: first_week_telestroke
      kind: specific_assignment
      active: true
      fellow_groups: [NCC_JR, NCC_SR, STROKE]
      week: 1
      shift: Telestroke/Clinic
      strength: hard

    - name: isc
      kind: isc
      active: true
      fellow_groups: [STROKE]
      date: [2026, 2, 5]
      strength: hard

    - name: fourth_block_two_micu_fellows
      kind: fourth_block_two_micu_fellows
      active: true
      fellow_groups: [NCC_JR, NCC_SR]
      strength: hard

    - name: nh_no_first_block_ncc
      kind: stroke_no_block_one_ncc
      active: true
      fellow_groups: [NH]
      strength: hard

