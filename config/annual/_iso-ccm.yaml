# Vac TOTAL cap: the pins above fix WHICH weeks; this caps the COUNT at exactly 3.
- type: shift_total
  name: JR Vac total
  groups: [NCC_JR]
  shifts: [Vac]
  relation: exactly
  count: 3
  strength: hard
- type: shift_total
  name: SR Vac total
  groups: [NCC_SR]
  shifts: [Vac]
  relation: exactly
  count: 3
  strength: hard
- type: block_rotation
  name: CCM NCC 4wk blocks
  groups: [CCM]
  shifts: [NCC]
  block_size: 4
  block_offset: 1
  strength: hard
  nf_days_per_block: [6, 8]
# Stroke group: 6 NCC weeks each in 3-week blocks (2 blocks). Off NCC, a Stroke
# fellow is on Vac (the model requires every managed fellow to hold SOME shift each
# week — blank weeks are infeasible; forbidding all non-NCC shifts is UNSAT). Vac is
# the filler (user 2026-06-18). Budgeting [NCC, Vac] makes derive_forbidden_shifts
# forbid every OTHER shift, so Stroke shows only NCC or Vac. The Vac rule is a vacuous
# at_most (just seeds Vac into the budget); Vac lands on the ~47 non-NCC weeks.
- type: block_rotation
  name: Stroke NCC 3wk blocks
  groups: [Stroke]
  shifts: [NCC]
  block_size: 3
  block_offset: 0
  strength: hard
- type: shift_total
  name: Stroke NCC total
  groups: [Stroke]
  shifts: [NCC]
  relation: exactly
  count: 6
  strength: hard
- type: shift_total
  name: Stroke Vac filler (seeds Vac into budget; non-NCC weeks => Vac)
  groups: [Stroke]
  shifts: [Vac]
  relation: at_most
  count: 53
  strength: hard
- type: shift_total
  name: JR Elec floor
  groups: [NCC_JR]
  shifts: [Elec]
  relation: at_least
  count: 3
  strength: hard
