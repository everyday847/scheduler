# STROKE-GROUP experiment v2 (user 2026-06-19): continuity-focused variant of
# ncc-nf-weekband-stroke.yaml. Changes vs. v1:
#   - nf_ncc1_continuity: fullweek  (was weekday) — NCC1 constant all 7 days, not just Mon-Fri.
#   - nf_weekend_ncc2: true — weekend NCC2 is now COVERED (was forbidden), so NCC service
#     can span weekends instead of fragmenting at the Fri->Sat boundary. May be split.
#   - nf_min_ncc2_run_days: 2 — no isolated single-day NCC2 stints (per fellow).
#   - nf_min_ncc_run_days: 0 (OFF) and nf_weekend_ncc1_paired: false (OFF) — both were
#     proven individually UNSAT on the full week-band+Stroke roster (Slurm bisection
#     2026-06-19). The fullweek-NCC1 + weekend-NCC2 combo is the continuity mechanism now.
#   - nf_week_off_cap: 3 (was 2) — fullweek NCC1 + off-cap=2 is UNSAT (NF runs force 3
#     forced-off days that can't fit under cap 2 once fullweek thins the per-week pool;
#     verified by bisection 2026-06-19: offcap=3 OR rest=0 restores SAT). Raised to 3.
# Stroke group, Vac-3 caps, lex-order, NF cap, no-triple-CCM unchanged from v1.
solver_options: {call_tier_day_granular: true, nf_week_off_cap: 3, nf_max_consecutive_call_days: 14,
  nf_ccm_no_bridge_blocks: true, nf_min_ncc_block_weeks: true, nf_ncc1_continuity: fullweek,
  nf_ncc_week_penalty: 10, nf_ccm_block_penalty: 50, nf_service_day_band: 'off',
  nf_no_triple_ccm: true, nf_stroke_lex_order: true, nf_stroke_nf_cap: 12,
  nf_weekend_ncc2: true, nf_min_ncc2_run_days: 2, nf_ccm_block_nf_cap: 12}
fellow_groups:
  NCC_JR: [JR1, JR2, JR3]
  NCC_SR: [SR1, SR2]
  CCM: [CCM Generic 1, CCM Generic 2, CCM Generic 3]
  Stroke: [Stroke A, Stroke B, Stroke C, Stroke D]
shifts: [NCC, MICU, NS, SICU, Elec, Vac, Anaesthesia, Stroke, Telestroke/Clinic]
horizon_start: '2026-07-01'
num_weeks: 53
rules:
- type: shift_total
  name: JR MICU total
  groups: [NCC_JR]
  shifts: [MICU]
  relation: exactly
  count: 16
  strength: hard
- type: shift_total
