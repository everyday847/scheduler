# STROKE-GROUP experiment v4 (user 2026-06-22): ABSOLUTE day-budget anchors, tight bands.
# Replaces v3's floating soft-1/3 ratio with HARD absolute day budgets — gives the solver
# integer anchors to propagate (faster solves / faster UNSAT, and pins down good numbers).
# Bands are TIGHT, centered on 1/3 NF, anchored on observed solved schedules (v2c + v3soft):
#   - nf_service_day_band: per-fellow service-days (NCC1+NCC2+NF). JR 66-86, SR 108-120,
#     Stroke 28-34. (CCM omitted — its week count varies; handled per-block below.)
#   - nf_nf_day_band: per-fellow ABSOLUTE NF-days. JR 23-27, SR 36-40, Stroke 9-12
#     (each ~1/3 of the group's service days). Aggregate JR+SR+Stroke NF=[177,209] leaves
#     CCM ~52-62 NF/fellow of the 365 NF-day demand — comfortably coverable.
#   - nf_ccm_block_nf_cap: 12 — CCM balanced PER NCC block (<=12 NF/4wk block, <=14/5wk
#     first block), not over the variable annual total.
#   - soft-1/3 (nf_one_third_nf_band/weight) OFF — superseded by the hard bands.
# Base (fullweek NCC1, off-cap 3, weekend NCC2, NCC2>=2-run, no-triple-CCM, Stroke rules)
# unchanged from v3. THESE BANDS ARE A FIRST PROBE: if UNSAT, the fast failure tells us
# which group's band is too tight -> widen and re-probe.
solver_options: {call_tier_day_granular: true, nf_week_off_cap: 3, nf_max_consecutive_call_days: 14,
  nf_ccm_no_bridge_blocks: true, nf_min_ncc_block_weeks: true, nf_ncc1_continuity: fullweek,
  nf_ncc_week_penalty: 10, nf_ccm_block_penalty: 50,
  nf_service_day_band: {NCC_JR: [76, 76], NCC_SR: [114, 114], Stroke: [31, 31]},
  nf_no_triple_ccm: true, nf_stroke_lex_order: true, nf_stroke_nf_cap: 12,
  nf_weekend_ncc2: true, nf_min_ncc2_run_days: 2,
  nf_nf_day_band: {NCC_JR: [25, 25], NCC_SR: [38, 38], Stroke: [10, 10]},
  nf_ccm_block_nf_cap: 12}
fellow_groups:
  NCC_JR: [JR1, JR2, JR3]
  NCC_SR: [SR1, SR2]
  CCM: [CCM Generic 1, CCM Generic 2, CCM Generic 3]
  Stroke: [Stroke A, Stroke B, Stroke C, Stroke D]
shifts: [NCC, MICU, NS, SICU, Elec, Vac, Anaesthesia, Stroke, Telestroke/Clinic]
horizon_start: '2026-07-01'
num_weeks: 53
