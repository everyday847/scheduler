  name: JR Vac total
  groups: [NCC_JR]
  shifts: [Vac]
  relation: exactly
  count: 3
  strength: hard
- type: shift_total
  name: SR Vac total
  groups: [NCC_SR]
  shifts: [Vac]
  relation: exactly
