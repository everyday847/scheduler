# Standing Rules describe how Stanford runs the fellowship program.
# They should change deliberately and rarely, not during routine schedule tuning.

rules:

  # We are responsible for NCC and Stroke fellows having something to do, all
  # the time.
  - name: full_assignment_for_owned_schedules
    kind: full_assignment
    active: true
    strength: hard
    fellow_groups: [NCC_JR, NCC_SR, STROKE]

  # There can be one extra fellow on NCC+Swing, but no more.
  - name: ncc_coverage
    kind: ncc_coverage
    active: true
    strength: hard
    fellow_groups: [NCC_JR, NCC_SR, STROKE, CCM, NH]
    shifts: [NCC1, NCC2, Swing]
    max_ncc_fellows: 3
    max_ncc_plus_swing_fellows: 4
    swing_deficit: 2

  # We want as few uncovered swing shifts as possible.
  - name: minimize_swing_deficit
    kind: minimize_uncovered_shift_weeks
    active: true
    strength: minimize
    fellow_groups: [NCC_JR, NCC_SR, STROKE, CCM, NH]
    shifts: [Swing]

  - name: core_icu
    kind: max_consecutive
    active: true
    strength: hard
    fellow_groups: [NCC_JR, NCC_SR, STROKE, NH]
    shifts: [NCC1, NCC2, Swing, SICU, MICU, Stroke] #, NIR]
    weeks: 8

  - name: ncc_team
    kind: max_consecutive
    active: true
    strength: hard
    fellow_groups: [NCC_JR, NCC_SR, STROKE, NH]
    shifts: [NCC1, NCC2, Swing]
    weeks: 6

  - name: swing
    kind: max_consecutive
    active: true
    strength: hard
    # Excludes CCM and NH because they're rotating and will never do >1
    fellow_groups: [NCC_JR, NCC_SR, STROKE]
    shifts: [Swing]
    weeks: 2

  - name: junior_ncc_before_swing
    kind: jr_ncc_before_swing
    active: true
    strength: hard
    fellow_groups: [NCC_JR]
    ncc_weeks: 4

  - name: ncc_two_week_block_choice
    kind: block_shift_set_choice
    active: true
    strength: hard
    fellow_groups: [NCC_JR, NCC_SR, CCM]
    block_size: 2
    choices:
      - [NCC1, Swing]
      - [NCC2, Swing]
    allow_none: true

  - name: ncc_four_week_block_preference
    kind: block_shift_set_choice
    active: true
    strength: soft
    fellow_groups: [NCC_JR, NCC_SR]
    block_size: 4
    choices:
      - [NCC1, Swing]
      - [NCC2, Swing]
    allow_none: true

  - name: micu_four_week_blocks
    kind: all_or_none_block
    active: true
    strength: hard
    fellow_groups: [NCC_JR, NCC_SR]
    shifts: [MICU]
    block_size: 4

  - name: sicu_four_week_blocks
    kind: all_or_none_block
    active: true
    strength: hard
    fellow_groups: [NCC_JR]
    shifts: [SICU]
    block_size: 4

  - name: anaesthesia_four_week_blocks
    kind: all_or_none_block
    active: true
    strength: hard
    fellow_groups: [NCC_JR]
    shifts: [Anaesthesia]
    block_size: 4

  - name: ns_four_week_blocks
    kind: all_or_none_block
    active: true
    strength: hard
    fellow_groups: [NCC_SR]
    shifts: [NS]
    block_size: 2

  - name: stroke_two_week_blocks
    kind: all_or_none_block
    active: false
    strength: hard
    fellow_groups: [STROKE]
    shifts: [Stroke] #, Telestroke/Clinic]
    block_size: 2

  - name: ncc_stroke_shift_two_week_blocks
    kind: all_or_none_block
    active: true
    strength: hard
    fellow_groups: [NCC_JR, NCC_SR]
    shifts: [Stroke] #, Telestroke/Clinic]
    block_size: 2

  # - name: scvmc_two_week_blocks
  #   kind: all_or_none_block
  #   active: false
  #   strength: hard
  #   fellow_groups: [STROKE]
  #   shifts: [SCVMC Rehab]
  #   block_size: 2

  - name: ncc_stroke_oversight
    kind: ncc_stroke_oversight
    active: true
    strength: soft
    fellow_groups: [NCC_JR, NCC_SR, STROKE]

  # We can only have this active for configs where we are controlling stroke
  - name: stroke_shift_coverage
    kind: stroke_shift_coverage
    active: false
    strength: soft
    fellow_groups: [NCC_JR, NCC_SR, STROKE, NH]

  - name: comparable_half_year_distribution
    kind: comparable_half_year_distribution
    active: true
    strength: soft
    fellow_groups: [NCC_JR, NCC_SR]

  - name: stroke_short_core_icu_runs
    kind: max_consecutive
    active: false
    strength: soft
    fellow_groups: [STROKE]
    shifts: [NCC1, NCC2, Swing, SICU, MICU, Stroke] #, NIR]
    weeks: 2

  - name: stroke_nir_one_week_per_half
    kind: nir_one_week_per_half
    active: false
    strength: soft
    fellow_groups: [STROKE]

  - name: stroke_scvmc_second_half
    kind: scvmc_second_half
    active: false
    strength: hard
    fellow_groups: [STROKE]

  - name: stroke_no_first_block_ncc
    kind: stroke_no_block_one_ncc
    active: false
    strength: soft
    fellow_groups: [STROKE]

  - name: stroke_service_profile
    kind: service_profile
    active: false
    strength: soft
    fellow_groups: [STROKE]
    zero_shifts:
      - NS
      - MICU
      - SICU
      - Anaesthesia
    totals:
      - shifts: [Swing]
        relation: exactly
        weeks: 2
      - shifts: [NCC1, NCC2]
        relation: exactly
        weeks: 4
      - shifts: [Stroke]
        relation: at_least
        weeks: 11
      - shifts: [Elec]
        relation: at_least
        weeks: 4
      - shifts: [Vac]
        relation: at_least
        weeks: 3
      # - shifts: [Telestroke/Clinic]
      #   relation: at_least
      #   weeks: 11
      # - shifts: [Clinic/Elective]
      #   relation: at_least
      #   weeks: 11
      # - shifts: [SCVMC Rehab]
      #   relation: exactly
      #   weeks: 2
      # - shifts: [NIR]
      #   relation: exactly
      #   weeks: 2
      # - shifts: [ISC]
      #   relation: exactly
      #   weeks: 1

  - name: ncc_jr_service_profile
    kind: service_profile
    active: true
    strength: soft
    fellow_groups: [NCC_JR]
    zero_shifts:
      - NS
      - Stroke
      # - Telestroke/Clinic
      # - SCVMC Rehab
      # - NIR
      # - Clinic/Elective
      # - ISC
    totals:
      - shifts: [MICU]
        relation: exactly
        weeks: 20
      - shifts: [Anaesthesia]
        relation: exactly
        weeks: 4
      - shifts: [Elec]
        relation: exactly
        weeks: 8
      - shifts: [Vac]
        relation: exactly
        weeks: 4
      - shifts: [SICU]
        relation: at_least
        weeks: 4
      - shifts: [Swing, NCC1, NCC2]
        relation: exactly
        weeks: 12
    window_totals:
      - shifts: [MICU]
        relation: exactly
        weeks: 4
        window: [0, 4]
      - shifts: [NCC1, NCC2]
        relation: at_least
        weeks: 1
        window: [4, 19]

  - name: ncc_sr_service_profile
    kind: service_profile
    active: true
    strength: soft
    fellow_groups: [NCC_SR]
    zero_shifts:
      - Anaesthesia
      - SICU
      # - SCVMC Rehab
      # - NIR
      # - Clinic/Elective
      # - ISC
      # - Telestroke/Clinic
    totals:
      - shifts: [MICU]
        relation: exactly
        weeks: 8
      - shifts: [Elec]
        relation: at_least
        weeks: 12
      - shifts: [Vac]
        relation: at_least
        weeks: 4
      - shifts: [NS]
        relation: exactly
        weeks: 6
      - shifts: [Stroke]
        relation: exactly
        weeks: 2
      - shifts: [Swing, NCC1, NCC2]
        relation: exactly
        weeks: 22

  - name: nh_service_profile
    kind: service_profile
    active: true
    strength: soft
    fellow_groups: [NH]
    zero_shifts:
      - NS
      - MICU
      - SICU
      - Anaesthesia
      - Stroke
      # - Clinic/Elective
      # - Telestroke/Clinic
      - Elec
      # - SCVMC Rehab
      # - NIR
      - Vac
      # - ISC
    totals:
      - shifts: [NCC1, NCC2]
        relation: exactly
        weeks: 3
      - shifts: [Swing]
        relation: exactly
        weeks: 1
    active_blocks:
      - name: nh_ncc_block
        block_size: 4
        trigger_shifts: [NCC1, NCC2, Swing]
        counts:
          - shifts: [NCC1, NCC2, Swing]
            relation: exactly
            weeks: 4
          - shifts: [Swing]
            relation: exactly
            weeks: 1
              
  - name: ccm_service_profile
    kind: service_profile
    active: true
    strength: soft
    fellow_groups: [CCM]
    zero_shifts:
      - NS
      - MICU
      - SICU
      - Anaesthesia
      - Stroke
      # - Clinic/Elective
      # - Telestroke/Clinic
      - Elec
      # - SCVMC Rehab
      # - NIR
      - Vac
      # - ISC
    totals:
      - shifts: [NCC1, NCC2]
        relation: at_least
        weeks: 3
      - shifts: [Swing]
        relation: at_least
        weeks: 1
    active_blocks:
      - name: ccm_ncc_block
        block_size: 4
        trigger_shifts: [NCC1, NCC2, Swing]
        counts:
          - shifts: [NCC1, NCC2, Swing]
            relation: exactly
            weeks: 4
          - shifts: [Swing]
            relation: exactly
            weeks: 1
